<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="logo-container">
    <img src="public/logo.png" alt="Logo" class="logo">
    <h1>Lista de Tareas</h1>
  </div>

  <div class="input-group">
    <input type="text" id="tareaInput" placeholder="Escribe una tarea...">
    <button onclick="agregarTarea()">Agregar</button>
  </div>

  <!-- CONTADOR -->
  <div class="contador">
    <p id="contadorTexto">0 completadas de 0 tareas</p>
  </div>

  <!-- FILTROS -->
  <div class="filtros">
    <button onclick="filtrarTareas('todas')">Todas</button>
    <button onclick="filtrarTareas('pendientes')">Pendientes</button>
    <button onclick="filtrarTareas('completadas')">Completadas</button>
  </div>

  <ul id="listaTareas"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
